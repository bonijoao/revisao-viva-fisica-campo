name: registrar
on:
  issues:
    types: [closed]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: registrar-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  registrar:
    if: contains(github.event.issue.labels.*.name, 'triagem')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Registrar decisões e commitar estado
        id: registrar
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVISOR: ${{ github.event.sender.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$ISSUE_BODY" > "$RUNNER_TEMP/corpo.md"
          ok=0
          for tentativa in 1 2 3; do
            Rscript scripts/registrar_issue.R "$RUNNER_TEMP/corpo.md" "$ISSUE_NUMBER" "$REVISOR"
            rodada=$(grep '^rodada=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)
            git add -A -- dados
            if git diff --cached --quiet; then
              echo "Nada a commitar."
              ok=1
              break
            fi
            git commit -m "dados: triagem ${rodada} (issue #${ISSUE_NUMBER})"
            if git pull --rebase && git push; then
              ok=1
              break
            fi
            echo "Falha ao enviar (tentativa ${tentativa}); refazendo sobre o estado remoto."
            git rebase --abort 2>/dev/null || true
            git fetch origin
            git reset --hard "origin/${GITHUB_REF_NAME}"
          done
          if [ "$ok" != 1 ]; then
            echo "Não foi possível enviar o estado após 3 tentativas." >&2
            exit 1
          fi
      - name: Comentar resumo
        env:
          RESUMO: ${{ steps.registrar.outputs.resumo }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Decisões registradas: ${RESUMO}."
      - name: Disparar site
        run: gh workflow run site.yml
